# LabSecurity own rules: Bicep files (Opengrep has no Bicep parser, so these are text rules). They mirror two rules of
# the official Bicep linter so that a plain repository scan reports them without running the Bicep CLI.
rules:
  - id: labsec.bicep.output-exposes-secret
    languages: [regex]
    severity: ERROR
    message: >-
      A Bicep output returns a list*() function result (for example listKeys) or a value named like a secret. Outputs
      are stored in the deployment history, so a reader with read-only access can see them. Remove the output and read
      the secret from Key Vault at runtime.
    pattern-regex: '(?im)^\s*output\s+\w+\s+\w+\s*=[^\n]*(\blist[A-Za-z]*\(|\b\w*(password|secret)\w*\b)'
    paths:
      include: ["*.bicep"]
    metadata:
      category: security
      technology: [azure, bicep]
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: "A04:2025 - Cryptographic Failures"
      asvs: [V13.3.1]
      standard: "OWASP ASVS 5.0.0 V13.3.1; Microsoft Learn, Bicep linter rule outputs-should-not-contain-secrets"
      confidence: MEDIUM
      subcategory: [audit]
      likelihood: "MEDIUM"
      impact: "HIGH"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x22-V13-Configuration.md
        - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/linter-rule-outputs-should-not-contain-secrets

  - id: labsec.bicep.secure-parameter-default
    languages: [regex]
    severity: ERROR
    message: >-
      A parameter marked @secure() has a hard-coded default value. The default is committed to the repository and is
      used whenever the caller omits the parameter. Leave the default empty or use newGuid().
    pattern-regex: "(?m)@secure\\(\\)\\s*\\n\\s*param\\s+\\w+\\s+(string|object)\\s*=\\s*'[^']+'"
    paths:
      include: ["*.bicep"]
    metadata:
      category: security
      technology: [azure, bicep]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2025 - Authentication Failures"
      asvs: [V13.3.1]
      standard: "OWASP ASVS 5.0.0 V13.3.1; Microsoft Learn, Bicep linter rule secure-parameter-default"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "HIGH"
      impact: "HIGH"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x22-V13-Configuration.md
        - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/linter-rule-secure-parameter-default

  - id: labsec.bicep.admin-username-literal
    languages: [regex]
    severity: WARNING
    message: >-
      An adminUsername property is set to a literal value. A fixed administrator name is committed to the repository and
      is the first thing a password-guessing attack tries. Create a parameter for the user name and assign it to the
      property (for example `adminUsername: adminUsername`).
    pattern-regex: "(?im)^[ \\t]*adminUserName[ \\t]*:[ \\t]*'(?:[^'$\\n]|\\$(?!\\{))*'"
    paths:
      include: ["*.bicep"]
    metadata:
      category: security
      technology: [azure, bicep]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2025 - Authentication Failures"
      standard: "Microsoft Learn, Bicep linter rule adminusername-should-not-be-literal"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      references:
        - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/linter-rule-admin-username-should-not-be-literal
