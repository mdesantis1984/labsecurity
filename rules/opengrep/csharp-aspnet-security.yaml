# LabSecurity own rules: ASP.NET Core configuration weaknesses that the vendored community packs do not cover
# (JWT validation switches, CORS reflection with credentials, cookie flags, TLS validation bypass, developer error page).
# Standards: OWASP ASVS 5.0.0 and Microsoft Learn; every reference was fetched when the rule was written.
rules:
  - id: labsec.csharp.jwt-validate-issuer-disabled
    languages: [csharp]
    severity: ERROR
    message: >-
      TokenValidationParameters.ValidateIssuer is set to false, so tokens minted by any issuer that shares the signing
      key (or by a misconfigured tenant) are accepted. Keep ValidateIssuer enabled and set ValidIssuer(s).
    pattern-either:
      - pattern: $O.ValidateIssuer = false
      - pattern: ValidateIssuer = false
    metadata:
      category: security
      technology: [csharp, aspnetcore, jwt]
      cwe: "CWE-345: Insufficient Verification of Data Authenticity"
      owasp: "A07:2025 - Authentication Failures"
      asvs: [V9.1.3]
      standard: "OWASP ASVS 5.0.0 V9.1.3; Microsoft Learn, TokenValidationParameters.ValidateIssuer"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "MEDIUM"
      impact: "HIGH"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x18-V9-Self-contained-Tokens.md
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.identitymodel.tokens.tokenvalidationparameters
        - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/configure-jwt-bearer-authentication

  - id: labsec.csharp.jwt-validate-audience-disabled
    languages: [csharp]
    severity: ERROR
    message: >-
      TokenValidationParameters.ValidateAudience is set to false, so a token issued for another service is accepted
      here. Keep ValidateAudience enabled and set ValidAudience(s).
    pattern-either:
      - pattern: $O.ValidateAudience = false
      - pattern: ValidateAudience = false
    metadata:
      category: security
      technology: [csharp, aspnetcore, jwt]
      cwe: "CWE-345: Insufficient Verification of Data Authenticity"
      owasp: "A07:2025 - Authentication Failures"
      asvs: [V9.2.3]
      standard: "OWASP ASVS 5.0.0 V9.2.3; Microsoft Learn, TokenValidationParameters.ValidateAudience"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "MEDIUM"
      impact: "HIGH"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x18-V9-Self-contained-Tokens.md
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.identitymodel.tokens.tokenvalidationparameters

  - id: labsec.csharp.jwt-signature-validation-disabled
    languages: [csharp]
    severity: ERROR
    message: >-
      Signature or signing-key validation of self-contained tokens is turned off (ValidateIssuerSigningKey = false or
      RequireSignedTokens = false). Unsigned or tampered tokens may be accepted. Keep both enabled.
    pattern-either:
      - pattern: $O.ValidateIssuerSigningKey = false
      - pattern: ValidateIssuerSigningKey = false
      - pattern: $O.RequireSignedTokens = false
      - pattern: RequireSignedTokens = false
    metadata:
      category: security
      technology: [csharp, aspnetcore, jwt]
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A07:2025 - Authentication Failures"
      asvs: [V9.1.1]
      standard: "OWASP ASVS 5.0.0 V9.1.1; Microsoft Learn, TokenValidationParameters.RequireSignedTokens"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "MEDIUM"
      impact: "HIGH"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x18-V9-Self-contained-Tokens.md
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.identitymodel.tokens.tokenvalidationparameters

  - id: labsec.csharp.jwt-require-https-metadata-disabled
    languages: [csharp]
    severity: WARNING
    message: >-
      RequireHttpsMetadata = false lets the authority metadata (and the signing keys inside it) travel over plain HTTP.
      Microsoft documents it as a development-only switch. Guard it behind an environment check or remove it.
    patterns:
      - pattern-either:
          - pattern: $O.RequireHttpsMetadata = false
          - pattern: RequireHttpsMetadata = false
      - pattern-not-inside: |
          if ($ENV.IsDevelopment()) { ... }
    metadata:
      category: security
      technology: [csharp, aspnetcore, jwt]
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp: "A04:2025 - Cryptographic Failures"
      asvs: [V12.3.1]
      standard: "OWASP ASVS 5.0.0 V12.3.1; Microsoft Learn, JwtBearerOptions.RequireHttpsMetadata"
      confidence: MEDIUM
      subcategory: [audit]
      likelihood: "MEDIUM"
      impact: "HIGH"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x21-V12-Secure-Communication.md
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.authentication.jwtbearer.jwtbeareroptions.requirehttpsmetadata

  - id: labsec.csharp.cors-reflect-any-origin-with-credentials
    languages: [csharp]
    severity: ERROR
    message: >-
      The CORS policy accepts every origin through SetIsOriginAllowed and also allows credentials, which reflects any
      Origin together with cookies or authorization data. Use WithOrigins(...) with a fixed list.
    patterns:
      - pattern-either:
          - pattern: $B.SetIsOriginAllowed($P => true)
          - pattern: $B.SetIsOriginAllowed((...) => true)
      - pattern-inside: |
          $T $F(...) {
            ...
            $X.AllowCredentials();
            ...
          }
    metadata:
      category: security
      technology: [csharp, aspnetcore, cors]
      cwe: "CWE-942: Permissive Cross-domain Security Policy with Untrusted Domains"
      owasp: "A02:2025 - Security Misconfiguration"
      asvs: [V3.4.2]
      standard: "OWASP ASVS 5.0.0 V3.4.2; Microsoft Learn, ASP.NET Core CORS, credentials in cross-origin requests"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "HIGH"
      impact: "HIGH"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x12-V3-Web-Frontend-Security.md
        - https://learn.microsoft.com/en-us/aspnet/core/security/cors

  - id: labsec.csharp.cookie-secure-disabled
    languages: [csharp]
    severity: WARNING
    message: >-
      A cookie is explicitly marked as not Secure (Secure = false or CookieSecurePolicy.None), so the browser may send
      it over plain HTTP. Use Secure = true or CookieSecurePolicy.Always.
    pattern-either:
      - pattern: new CookieOptions { ..., Secure = false, ... }
      - pattern: $O.Cookie.SecurePolicy = CookieSecurePolicy.None
      - pattern: SecurePolicy = CookieSecurePolicy.None
    metadata:
      category: security
      technology: [csharp, aspnetcore, cookies]
      cwe: "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      owasp: "A02:2025 - Security Misconfiguration"
      asvs: [V3.3.1]
      standard: "OWASP ASVS 5.0.0 V3.3.1; OWASP ASVS V3.3.1 (Secure attribute)"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x12-V3-Web-Frontend-Security.md
        - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/cookie

  - id: labsec.csharp.cookie-httponly-disabled
    languages: [csharp]
    severity: WARNING
    message: >-
      A cookie is explicitly created with HttpOnly = false, so client-side script can read it. Use HttpOnly = true for
      session and authentication cookies.
    pattern-either:
      - pattern: new CookieOptions { ..., HttpOnly = false, ... }
      - pattern: $O.Cookie.HttpOnly = false
    metadata:
      category: security
      technology: [csharp, aspnetcore, cookies]
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: "A02:2025 - Security Misconfiguration"
      asvs: [V3.3.4]
      standard: "OWASP ASVS 5.0.0 V3.3.4; OWASP ASVS V3.3.4 (HttpOnly attribute)"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x12-V3-Web-Frontend-Security.md
        - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/cookie

  - id: labsec.csharp.tls-certificate-validation-bypass
    languages: [csharp]
    severity: ERROR
    message: >-
      Server certificate validation is bypassed (a callback that always returns true, or
      DangerousAcceptAnyServerCertificateValidator). The client then talks to any server that presents any
      certificate. Validate the certificate, or trust a specific internal CA.
    pattern-either:
      - pattern: $O.ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator
      - pattern: $O.ServerCertificateCustomValidationCallback = (...) => true
      - pattern: $O.ServerCertificateValidationCallback = (...) => true
      - pattern: $O.ServerCertificateValidationCallback += (...) => true
      - pattern: $O.RemoteCertificateValidationCallback = (...) => true
      - pattern: ServerCertificateCustomValidationCallback = (...) => true
    metadata:
      category: security
      technology: [csharp, dotnet, tls]
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A07:2025 - Authentication Failures"
      asvs: [V12.3.2]
      standard: "OWASP ASVS 5.0.0 V12.3.2; Microsoft Learn, HttpClient guidelines; OWASP ASVS V12.3.2"
      confidence: HIGH
      subcategory: [vuln]
      likelihood: "HIGH"
      impact: "HIGH"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x21-V12-Secure-Communication.md
        - https://learn.microsoft.com/en-us/dotnet/fundamentals/networking/http/httpclient-guidelines

  - id: labsec.csharp.developer-exception-page-unguarded
    languages: [csharp]
    severity: WARNING
    message: >-
      UseDeveloperExceptionPage() runs without an IsDevelopment() guard, so a production deployment can return stack
      traces and request details to the client. Enable it only in the Development environment.
    patterns:
      - pattern: $APP.UseDeveloperExceptionPage()
      - pattern-not-inside: |
          if ($ENV.IsDevelopment()) { ... }
      - pattern-not-inside: |
          if ($APP.Environment.IsDevelopment()) { ... }
    metadata:
      category: security
      technology: [csharp, aspnetcore]
      cwe: "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp: "A02:2025 - Security Misconfiguration"
      asvs: [V13.4.2, V16.5.1]
      standard: "OWASP ASVS 5.0.0 V13.4.2, V16.5.1; Microsoft Learn, Developer Exception Page"
      confidence: MEDIUM
      subcategory: [audit]
      likelihood: "MEDIUM"
      impact: "MEDIUM"
      references:
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x25-V16-Security-Logging-and-Error-Handling.md
        - https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x22-V13-Configuration.md
        - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/error-handling
